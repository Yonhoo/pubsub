syntax = "proto3";

package protocol;

option go_package = "github.com/livekit/psrpc/examples/pubsub/protocol/push;push";

import "protocol/protocol.proto";

message PushMsgReq {
  repeated string keys = 1;
  protocol.Proto proto = 2;
  int32 protoOp = 3;
}

message PushMsgReply {}

message BroadcastReq{
  int32 protoOp = 1;
  protocol.Proto proto = 2;
  int32 speed = 3;
}

message BroadcastReply{}

message BroadcastRoomReq {
  string roomID = 1;
  protocol.Proto proto = 2;
}

message BroadcastRoomBatchReq {
  string roomID = 1;
  repeated protocol.Proto protos = 2;
  bytes packedProtos = 3;
}

message BroadcastRoomReply{}

message RoomsReq{}

message RoomsReply {
  map<string,bool> rooms = 1;
}

service Comet {
  // PushMsg push by key or mid
  rpc PushMsg(PushMsgReq) returns (PushMsgReply);
  // Broadcast send to every entity
  rpc Broadcast(BroadcastReq) returns (BroadcastReply);
  // BroadcastRoom broadcast to one room
  rpc BroadcastRoom(BroadcastRoomReq) returns (BroadcastRoomReply);
  // BroadcastRoomBatch broadcasts a pre-aggregated room batch.
  rpc BroadcastRoomBatch(BroadcastRoomBatchReq) returns (BroadcastRoomReply);
  // Rooms get all rooms
  rpc Rooms(RoomsReq) returns (RoomsReply);
}
